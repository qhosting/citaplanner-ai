version: '3.8'

services:
  citaplanner-db:
    image: postgres:15-alpine
    container_name: citaplanner-db
    restart: always
    environment:
      POSTGRES_USER: citaplanner_admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: citaplanner_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - citaplanner_internal

  citaplanner-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citaplanner-app
    restart: always
    depends_on:
      - citaplanner-db
    environment:
      DATABASE_URL: postgresql://citaplanner_admin:${DATABASE_PASSWORD}@citaplanner-db:5432/citaplanner_prod?schema=public&sslmode=disable
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${DOMAIN_URL}
      API_KEY: ${API_KEY}
      QHOSTING_ADMIN_NAME: ${QHOSTING_ADMIN_NAME}
      QHOSTING_ADMIN_PHONE: ${QHOSTING_ADMIN_PHONE}
      QHOSTING_ADMIN_EMAIL: ${QHOSTING_ADMIN_EMAIL}
      QHOSTING_ADMIN_PASSWORD: ${QHOSTING_ADMIN_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - citaplanner_internal

  caddy:
    image: caddy:2.7-alpine
    container_name: citaplanner-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN_URL=${DOMAIN_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - citaplanner_internal
    depends_on:
      - citaplanner-app

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:


networks:
  citaplanner_internal:
    driver: bridge
